<!DOCTYPE html>
<html lang="en">
<head>

    <title>Task 4 - Table and Form</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Student Information</h1>

        <nav>
            <a href="index.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
            <a href="task4.html">Task 4</a>
        </nav>
    </header>

    <div class="content">

        <h2 id="grades-title">Student Grades</h2>

        <table>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>

            <tr>
                <td>Altair</td>
                <td>HTML</td>
                <td>95</td>
            </tr>

            <tr class="highlight-row">
                <td>Ali</td>
                <td>CSS</td>
                <td>98</td>
            </tr>

            <tr>
                <td>John</td>
                <td>JavaScript</td>
                <td>90</td>
            </tr>

            <tr>
                <td colspan="2">Average Grade</td>
                <td>94</td>
            </tr>
        </table>

        <h2>Feedback Form</h2>

        <form>

            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="role">Your role:</label>
            <select id="role" name="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="other">Other</option>
            </select>

            <p>Do you like this website?</p>

            <label>
                <input type="radio" name="answer" value="yes">
                Yes
            </label>

            <label>
                <input type="radio" name="answer" value="no">
                No
            </label>

            <label for="comments">Comments:</label>
            <textarea
                id="comments"
                name="comments"
                placeholder="Write your comments"
                rows="5"
            ></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

    <footer>
        <p>&copy; Altair Abdraissov SE-2528</p>
    </footer>

</body>
</html>
